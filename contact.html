<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Dr. Marta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #F5F0E8;
            --cream: #FAF7F2;
            --white: #FFFFFF;
            --text: #2C1810;
            --brown: #5C3D2E;
            --orange: #E65028;
            --yellow: #F4C430;
            --muted: #9B8575;
            --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Anton', Impact, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
            font-size: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Navigation */
        nav {
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(245, 240, 232, 0.95);
        }

        .nav-logo {
            font-family: var(--font-sans);
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        nav a {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text);
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 32px;
        }

        .form-container {
            max-width: 560px;
            width: 100%;
        }

        .form-container h1 {
            font-family: var(--font-display);
            font-size: clamp(40px, 6vw, 56px);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--orange);
            margin-bottom: 12px;
            line-height: 1.1;
        }

        .form-container .subtitle {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 40px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            font-weight: 500;
        }

        .field-group input,
        .field-group textarea {
            font-family: var(--font-sans);
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid rgba(44, 24, 16, 0.12);
            background: var(--white);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .field-group input:focus,
        .field-group textarea:focus {
            border-color: var(--orange);
        }

        .field-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--orange);
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
        }

        .checkbox-group .no-spam {
            font-size: 12px;
            color: var(--muted);
            margin-left: 4px;
        }

        .submit-btn {
            font-family: var(--font-sans);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
            padding: 16px 32px;
            background: var(--text);
            color: var(--white);
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: var(--orange);
        }

        .back-link {
            display: inline-block;
            margin-top: 32px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text);
        }

        /* Footer */
        footer {
            padding: 40px 32px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            background: var(--bg);
        }

        @media (max-width: 768px) {
            nav {
                padding: 16px 20px;
            }

            .nav-links {
                display: none;
            }

            main {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">Dr. Marta</a>
        <div class="nav-links">
            <a href="index.html#work">Work</a>
            <a href="index.html#writing">Writing</a>
            <a href="index.html#contact">Contact</a>
        </div>
    </nav>

    <main>
        <div class="form-container">
            <h1>Let's create something beautiful.</h1>
            <p class="subtitle">Tell me a bit about yourself and what you're looking for.</p>

            <form action="https://formsubmit.co/marta@drmarta.design" method="POST">
                <input type="hidden" name="_subject" value="New message from drmarta.life">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">

                <div class="field-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Maria Garcia" required>
                </div>

                <div class="field-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="e.g. maria@example.com" required>
                </div>

                <div class="field-group">
                    <label for="message">What brings you here?</label>
                    <textarea id="message" name="message" placeholder="Tell me about your project, question, or just say hello..." required></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    <label for="newsletter">Yes, I'd like to receive the free Design &amp; Joy newsletter <span class="no-spam">(no spam, ever)</span></label>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <a href="index.html" class="back-link">← Back to home</a>
        </div>
    </main>

    <footer>
        © 2026 Dr. Marta · Berkeley, California
    </footer>

</body>
</html>
